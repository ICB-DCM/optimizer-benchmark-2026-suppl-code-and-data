name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v0.*.*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and tag the Docker image
        run: |
          IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          docker build -t stephanmg/pypesto-benchmark-docker:$IMAGE_TAG .

      - name: Push the Docker image to Docker Hub
        run: |
          IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          docker push stephanmg/pypesto-benchmark-docker:$IMAGE_TAG

      - name: Pip freeze environment
        run: |
          IMAGE_TAG="${GITHUB_REF#refs/tags/}"
          docker run --rm stephanmg/pypesto-benchmark-docker:$IMAGE_TAG pip freeze > requirements.txt

      #- name: Commit requirements.txt from pushed tag to repository
